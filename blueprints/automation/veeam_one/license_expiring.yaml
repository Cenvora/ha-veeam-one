blueprint:
  name: Veeam ONE license expiring soon
  description: >-
    Notify daily once the Veeam ONE license — or its support contract — is within a chosen
    number of days of expiring, and after it has expired.

    Pick the server's **License days remaining** sensor, the **License support days remaining**
    sensor, or both. Checks once a day at a time you choose rather than reacting to a state
    change, so the reminder keeps arriving until the license is renewed. A license with no
    expiration date reports no value and is simply skipped.

    The integration also raises a repair issue 30 days before the license expires; this is
    for when you want a notification, or a different lead time.
  domain: automation
  source_url: https://github.com/Cenvora/ha-veeam-one/blob/main/blueprints/automation/veeam_one/license_expiring.yaml
  author: Cenvora
  input:
    expiry_sensors:
      name: Days remaining sensors
      description: >-
        The "License days remaining" sensor, the "License support days remaining" sensor, or
        both.
      selector:
        entity:
          multiple: true
          filter:
            - integration: veeam_one
              domain: sensor
              device_class: duration
    days_before:
      name: Warn this many days ahead
      default: 30
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: days
          mode: box
    check_time:
      name: Check at
      description: Time of day to check.
      default: "09:00:00"
      selector:
        time:
    notification_action:
      name: Notification action
      description: >-
        What to run while a license is expiring. Available variables: `expiring` (a list of
        `{name, entity_id, days_left}` mappings), `soonest_days_left`, and ready-made `title`
        and `message`.
      selector:
        action:

mode: single

triggers:
  - trigger: time
    at: !input check_time

variables:
  days_before: !input days_before
  expiry_sensors: !input expiry_sensors
  # Days remaining goes negative once the license has expired. A license with no expiry
  # reports unknown, and a failed poll unavailable — skip those rather than reading them as 0.
  expiring: >-
    {% set ns = namespace(items=[]) %}
    {% for entity_id in expiry_sensors %}
      {% set value = states(entity_id) %}
      {% if value | lower not in ['unknown', 'unavailable', 'none', '']
            and value | is_number %}
        {% set days_left = value | float | round(0, 'floor') | int %}
        {% if days_left <= days_before %}
          {% set ns.items = ns.items + [{
               'name': (state_attr(entity_id, 'friendly_name') or entity_id)
                       | regex_replace('^Veeam ONE ', '')
                       | regex_replace('(?i) days remaining$', ''),
               'entity_id': entity_id,
               'days_left': days_left,
             }] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  soonest_days_left: >-
    {{ expiring | map(attribute='days_left') | list | min if expiring | count > 0 else none }}
  title: >-
    {%- if soonest_days_left is none -%}
      Veeam ONE license
    {%- elif soonest_days_left < 0 -%}
      Veeam ONE license has expired
    {%- elif soonest_days_left == 0 -%}
      Veeam ONE license expires today
    {%- else -%}
      Veeam ONE license expires in {{ soonest_days_left }} day{{ 's' if soonest_days_left != 1 }}
    {%- endif -%}
  message: >-
    {%- for item in expiring -%}
      {{ item.name }}: {{ 'expired ' ~ (0 - item.days_left) ~ ' day(s) ago' if item.days_left < 0
         else 'expires today' if item.days_left == 0
         else item.days_left ~ ' day(s) left' }}{{ '\n' if not loop.last }}
    {%- endfor -%}

conditions:
  - condition: template
    value_template: "{{ expiring | count > 0 }}"

actions: !input notification_action
