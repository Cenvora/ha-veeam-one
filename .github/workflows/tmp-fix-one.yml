name: Temporary ONE Ruff Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/initial-integration

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install ruff

      - run: |
          ruff format custom_components/veeam_one/
          ruff check --fix custom_components/veeam_one/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/veeam_one/
          git diff --cached --quiet || (git commit -m "style: apply Ruff formatting and fixes" && git push origin HEAD:feature/initial-integration)
